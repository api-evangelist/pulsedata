description: PulseData, Inc. is a healthcare artificial-intelligence company that applies
  machine learning and predictive analytics to chronic disease management, with a focus on
  chronic kidney disease. Its platform helps payers, providers, ACOs, and value-based care
  organizations identify at-risk patient populations, predict disease progression, and act
  by directing patients to targeted interventions and care programs. Named customers include
  Quest Diagnostics, US Renal Care, Vytalize, and HealthEdge. The company is SOC 2 Type II
  certified and was surfaced as a portfolio company of Bloomberg Beta. No public API,
  developer portal, SDKs, or machine-readable documentation were found during enrichment.
